<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAP ERP</title>
<style>:root{--shell:#354a5f;--bg:#f7f7f7;--tx:#32363a;--lb:#4b5055;--mu:#6a6d70;--fb:#89919a;--ln:#d9d9d9;--bt:#346187;--btb:#bfc6cf;--ac:#0a6ed1;--ok:#107e3e;--er:#bb0000;--wa:#e9730c;--sel:#e5f0fa;--hov:#eff4f9;--in:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.35 "72","72full",Arial,Helvetica,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* shell */
#app{display:none;position:fixed;inset:0;flex-direction:column}
#hdr{background:var(--shell);color:#fff;height:48px;display:flex;align-items:center;flex:none;padding:0 14px 0 0;user-select:none}
#bk{width:58px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer}#bk:hover{background:#ffffff1a}#bk.off{visibility:hidden}
#bk svg{width:20px;height:20px;stroke-width:2}
#logo{margin:0 22px 0 4px;display:flex}#ttl{font-size:17px;font-weight:bold;letter-spacing:.1px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:18px;font-size:13.5px;opacity:.92}.hr span{cursor:pointer;display:flex;align-items:center;gap:4px}.hr span:hover{opacity:1;text-decoration:underline}
#tb{display:flex;align-items:center;gap:6px;padding:8px 16px 6px 22px;flex:none;flex-wrap:wrap;min-height:48px;background:var(--bg)}
#mnu{color:var(--bt);cursor:pointer;display:flex;align-items:center;gap:3px;margin-right:10px;padding:4px 2px;font-size:14.5px}#mnu:hover{color:var(--ac)}
#cmdw{position:relative;margin-right:6px}
#cmd{width:240px;height:30px;border:1px solid var(--fb);border-radius:2px;background:#fff;padding:0 28px 0 8px;text-transform:uppercase}
#cmd:focus{outline:none;border-color:var(--ac)}
#cmdd{position:absolute;right:1px;top:1px;width:26px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer}
#tbx{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1}
#tbr{display:flex;gap:12px;align-items:center;margin-left:auto}
.tbb{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;background:#fff;border:1px solid var(--btb);border-radius:4px;color:var(--bt);cursor:pointer;white-space:nowrap;font-size:14.5px}
.tbb:hover{background:var(--hov);border-color:var(--bt)}.tbb.io{width:32px;padding:0;justify-content:center}.tbb.on{background:#dfe9f4;border-color:var(--bt)}
.tbb.dis{opacity:.45;pointer-events:none}.tbb .dd{width:10px;height:10px}
.lnk{color:var(--bt);cursor:pointer}.lnk:hover{color:var(--ac);text-decoration:underline}
#main{flex:1;overflow:auto;position:relative}
#scr{padding:6px 24px 40px 30px;min-height:100%}
#ftr{flex:none;height:46px;border-top:1px solid #e1e4e8;background:#fff;display:flex;align-items:center;padding:0 16px;gap:8px}
#sbar{flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;cursor:default}#sbar .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sbar.s{color:var(--ok)}#sbar.e{color:var(--er)}#sbar.w{color:var(--wa)}#sbar.i{color:var(--bt)}
#fbtn{display:flex;gap:8px}
.fb{height:30px;padding:0 12px;border:1px solid var(--btb);background:#fff;color:var(--bt);border-radius:4px;cursor:pointer;font-weight:bold;font-size:14px}
.fb:hover{background:var(--hov)}.fb.p{background:var(--ac);border-color:var(--ac);color:#fff}.fb.p:hover{background:#085caf}
/* home */
.home{display:grid;grid-template-columns:minmax(320px,1.15fr) 1fr;gap:20px;align-items:start;padding-top:4px}
.fv{background:#fff;border:1px solid #e5e5e5}.fv .h{padding:8px 14px;font-weight:bold;color:var(--tx);border-bottom:1px solid var(--ln);display:flex;gap:8px;align-items:center}
.fv .it{padding:6px 14px 6px 14px;color:#346187;cursor:pointer;border-bottom:1px solid #ececec;display:flex;gap:12px;align-items:center;font-size:14.5px}
.fv .it:hover,.fv .it.on{background:#e5f0fa}.fv .it .st{color:#24477a;font-size:15px}
#hero{position:sticky;top:0;height:calc(100vh - 170px);min-height:320px;border-radius:2px;background:radial-gradient(120% 90% at 85% 10%,#cfe1f3 0,transparent 55%),linear-gradient(160deg,#eaf2fa 0%,#b9d3ec 55%,#86aed6 100%)}
/* forms */
.sec{font-size:15.5px;color:var(--tx);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ln);max-width:1240px}
.sec.s2{font-size:15px;margin:10px 0 10px 22px}.sec.s3{font-size:15px;margin:14px 0 8px 46px;border:0;padding-bottom:0}.sec.first{margin-top:14px}
.fr{display:flex;align-items:center;min-height:34px;margin:2px 0}
.fl{flex:none;text-align:right;color:var(--lb);padding-right:6px;white-space:nowrap;font-size:14.5px}
.fl b{color:var(--er);font-weight:normal;margin-left:1px}.fl.dis{color:#a8adb2}
.fa{flex:none;display:flex;align-items:center;gap:6px}
.fw{position:relative;display:inline-flex;align-items:center}
.fw input,.fw select,.fw textarea{height:30px;border:1px solid var(--fb);border-radius:2px;background:#fff;padding:0 6px;font-family:"72mono","Courier New",Consolas,monospace;font-size:14.5px;letter-spacing:.3px}
.fw select{font-family:inherit;letter-spacing:0;padding-right:4px}
.fw textarea{height:auto;padding:5px 6px;font-family:inherit}
.fw input:focus,.fw select:focus,.fw textarea:focus{outline:none;border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.fw input.rq{background:#fff}.fw input.err{border-color:var(--er);box-shadow:inset 0 0 0 1px var(--er);background:#fff6f6}
.fw input[readonly],.fw input:disabled,.fw select:disabled{background:#f2f2f2;color:#555;border-color:#c5c9cd}
.fw input.num{text-align:right}
.f4{position:absolute;right:1px;top:1px;bottom:1px;width:28px;display:none;align-items:center;justify-content:center;color:var(--bt);cursor:pointer;background:#fff;border-left:1px solid #e5e5e5}
.fw:focus-within .f4,.fw:hover .f4{display:flex}.f4:hover{color:var(--ac)}
.to{flex:none;width:44px;text-align:right;padding-right:6px;color:var(--lb)}
.msb{width:44px;height:30px;border:1px solid var(--btb);border-radius:4px;background:#fff;color:var(--bt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.msb:hover{background:var(--hov)}.msb.on{color:#fff;background:var(--ok);border-color:var(--ok)}
.sbtn{height:30px;border:1px solid var(--btb);border-radius:4px;background:#fff;color:var(--bt);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;white-space:nowrap}
.sbtn:hover{background:var(--hov)}.sbtn.io{width:34px;padding:0}.sbtn.wide{min-width:240px}
.cbr{display:flex;align-items:center;gap:10px;min-height:32px;color:var(--lb);cursor:pointer;width:max-content}
.cbr.dis{color:#a8adb2;pointer-events:none}
input[type=checkbox],input[type=radio]{width:17px;height:17px;margin:0;accent-color:#0a6ed1;cursor:pointer;flex:none}
.rbr{display:flex;align-items:center;gap:10px;min-height:32px;color:var(--lb);cursor:pointer;width:max-content}
.grid3{display:grid;align-items:center;row-gap:4px;justify-content:start}
.g3c{display:flex;align-items:center;min-height:34px;padding-right:28px}
.side{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}
.tabs{display:flex;gap:30px;border-bottom:1px solid var(--ln);margin:8px 0 12px;padding-left:12px;align-items:flex-end;flex-wrap:wrap}
.tabs span{padding:8px 2px 7px;color:var(--lb);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs span:hover{color:var(--ac)}.tabs span.on{color:var(--bt);border-bottom-color:var(--bt)}
.note{color:var(--mu);font-size:13px}
.box{background:#fff;border:1px solid #e1e4e8;border-radius:2px}
.tip{position:fixed;z-index:90;background:#fff;border:1px solid #32363a;padding:4px 10px;font-size:14px;pointer-events:none;box-shadow:0 2px 6px #0002;display:none;max-width:420px}
/* menus */
.pop{position:fixed;z-index:80;background:#fff;border:1px solid #c7cdd4;box-shadow:0 4px 14px #0003;min-width:200px;padding:4px 0;border-radius:2px}
.pop div{padding:7px 16px 7px 14px;cursor:pointer;white-space:nowrap;display:flex;justify-content:space-between;gap:24px;color:var(--tx)}
.pop div:hover,.pop div.on{background:#e5f0fa}.pop div.sep{border-top:1px solid #e5e5e5;padding:0;margin:3px 0;cursor:default}.pop div .k{color:var(--mu);font-size:12.5px}
.pop div.dis{color:#a8adb2;cursor:default}
/* dialogs */
.ov{position:fixed;inset:0;background:#0000002e;z-index:70;display:flex;align-items:center;justify-content:center}
.dlg{background:#fff;border:1px solid #9ca5ae;box-shadow:0 8px 30px #0004;min-width:380px;max-width:94vw;max-height:90vh;display:flex;flex-direction:column;border-radius:3px}
.dlg .dh{padding:14px 18px 10px 22px;font-weight:bold;font-size:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;gap:20px}
.dlg .dh .x{cursor:pointer;color:var(--bt);display:flex;padding:4px}.dlg .dh .x:hover{color:var(--er)}
.dlg .db{padding:16px 22px;overflow:auto;flex:1}
.dlg .df{border-top:1px solid #e5e5e5;padding:10px 16px;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.ib{height:32px;min-width:36px;border:1px solid transparent;background:none;color:var(--bt);cursor:pointer;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px}
.ib:hover{background:var(--hov);border-color:var(--btb)}.ib.ok{color:var(--ok)}.ib.no{color:var(--er)}.ib svg{width:18px;height:18px}
/* ALV */
.alvh{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:10px 0 6px;padding:4px 0}
.alvh .ib{height:30px;min-width:32px;border:1px solid var(--btb);background:#fff}
.alvh .grp{display:flex;gap:4px;margin-right:6px}
.alvt{font-weight:bold;margin:12px 0 2px;font-size:15px}
.alvi{color:var(--mu);font-size:13px;margin:2px 0 4px}
.alvw{overflow:auto;border:1px solid #d5dadd;background:#fff;max-height:calc(100vh - 290px)}
table.alv{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%}
table.alv th{position:sticky;top:0;background:#f2f4f5;color:#32363a;font-weight:normal;text-align:left;padding:6px 10px;border-bottom:1px solid #d5dadd;border-right:1px solid #e5e8ea;white-space:nowrap;cursor:pointer;z-index:1}
table.alv th:hover{background:#e8ecef}table.alv th.r{text-align:right}
table.alv td{padding:4px 10px;border-bottom:1px solid #eceff1;border-right:1px solid #f1f3f4;white-space:nowrap;background:#fff}
table.alv td.r{text-align:right;font-variant-numeric:tabular-nums}
table.alv tr:hover td{background:#f5f9fd}table.alv tr.sel td{background:#d8e9f8}
table.alv td.cs,table.alv th.cs{width:24px;padding:0 4px;text-align:center;background:#f7f8f9;cursor:pointer}
table.alv tr.tot td{background:#fff8d6;font-weight:bold}table.alv tr.sub td{background:#fdf4c4}
table.alv td.neg{color:var(--er)}table.alv td.lk{color:var(--ac);cursor:pointer;text-decoration:underline}
.ic{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}.ic.r{background:#d32030}.ic.g{background:#2b7d2b}.ic.y{background:#e9a100}
.lamp{display:inline-flex;gap:2px;vertical-align:middle}.lamp i{width:8px;height:8px;border-radius:50%;background:#ddd;display:block}.lamp i.r{background:#d32030}.lamp i.y{background:#e9a100}.lamp i.g{background:#2b7d2b}
/* panels */
.split{display:flex;gap:0;align-items:stretch;min-height:calc(100vh - 160px)}
.lp{width:280px;flex:none;border-right:1px solid #d5dadd;background:#fafafa;padding:6px 0;overflow:auto}
.lp .ti{padding:5px 10px 5px 14px;cursor:pointer;white-space:nowrap;color:#346187}.lp .ti:hover{background:#e5f0fa}
.lp .tg{padding:6px 10px;font-weight:bold;color:var(--tx);cursor:pointer;display:flex;gap:6px;align-items:center}
.lp .ti.on{background:#d8e9f8}.lp .ti.mu{color:#8a9097}
.rp{flex:1;min-width:0;padding:0 0 0 18px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:2px 24px}
.kv .fr .fl{width:170px}
.stat{display:grid;grid-template-columns:200px 160px 110px;gap:12px 20px;align-items:center;padding:10px 20px}
.stat .n{text-align:right;font-family:"Courier New",monospace}
.bal{display:inline-flex;align-items:center;gap:8px}
.mbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}
.prev{font-family:Consolas,monospace;font-size:12.5px;white-space:pre;background:#fff;border:1px solid #ddd;padding:8px;max-height:260px;overflow:auto}
@media(max-width:820px){.home{grid-template-columns:1fr}#hero{height:200px;position:static}#scr{padding:6px 12px 40px}.fl{width:auto!important;min-width:120px}.fr{flex-wrap:wrap}.lp{display:none}#cmd{width:150px}}
</style></head><body>
<div id="app">
 <div id="hdr"><span id="bk" class="off" title="Back (F3)"><svg class="i" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></span><span id="logo"></span><span id="ttl"></span>
  <span class="hr"><span id="hmore" title="More">&#8250;</span><span id="sysi">NR5 (400) &#8964;</span></span></div>
 <div id="tb"><span id="mnu">Menu <svg class="i" viewBox="0 0 16 16" style="width:12px;height:12px"><path d="M4 6l4 4 4-4"/></svg></span><span id="cmdw"><input id="cmd" autocomplete="off" spellcheck="false"><span id="cmdd"><svg class="i" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></span></span><span id="tbx"></span><span id="tbr"><span class="lnk" id="exit">Exit</span></span></div>
 <div id="main"><section id="scr"></section></div>
 <div id="ftr"><div id="sbar"></div><div id="fbtn"></div></div>
</div>
<script>
/* ===================== data layer ===================== */
const T={},META={};
const KEY={T001:'BUKRS',SKA1:'SAKNR',CSKS:'KOSTL',MARA:'MAKTX',LFA1:'LIFNR',KNA1:'KUNNR',BSIK:'BELNR',BSID:'BELNR',EKPO:['EBELN','EBELP'],MSEG:['MBLNR','ZEILE'],RBKP:['BELNR','EBELN','EBELP'],VIMDP:'DOCID',SWWWIHEAD:'WI_ID',FKKVKP:'VKONT',DFKKOP:'OPBEL',DFKKBIX:'BITID',DFKKINVBILL:'INVDOC',DFKKZK:'KEYZ1',DFKKZP:['KEYZ1','POSZA'],FEBEP:['KUKEY','ESNUM'],GLDOC:'BELNR',LOG:'ID',RUNS:'RUNID'};
const kOf=(tb,r)=>{const k=KEY[tb];return Array.isArray(k)?k.map(x=>r[x]).join('/'):r[k]};
/* Business data lives in the server database, in the workspace of the current
   access session. The changes of one user action are sent as one batch and
   applied atomically by the server, which assigns document numbers and
   validates them. Success messages are shown only after the server confirmed
   the batch. Only personal preferences (variants, layouts, history) are kept
   in this browser. */
const ACCESS=window.__ACCESS__||{};
const API=ACCESS.api||'';
let ST;
const LSK='erp_prefs:'+(ACCESS.id||'local');
function stInit(){return{vari:{},hist:[],lay:{}}}
function loadPrefs(){try{ST=JSON.parse(localStorage.getItem(LSK))||stInit()}catch(e){ST=stInit()}ST.vari=ST.vari||{};ST.hist=ST.hist||[];ST.lay=ST.lay||{}}
function persist(){try{localStorage.setItem(LSK,JSON.stringify(ST))}catch(e){}}
async function fetchData(){const r=await fetch(API+'/data',{cache:'no-store',credentials:'same-origin'});if(!r.ok){const e=new Error('load');e.status=r.status;throw e}return r.json()}
function applyData(d){for(const k in T)delete T[k];for(const k in META)delete META[k];
  for(const k in d.tables){const t=d.tables[k];META[k]={c:t.c,l:t.l,d:t.d};T[k]=t.r.map(r=>{const o={};t.c.forEach((c,i)=>o[c]=r[i]);return o})}
  const L=d.lines||{};for(const tb in L){const ix={};(T[tb]||[]).forEach(r=>ix[r.BELNR]=r);for(const b in L[tb])if(ix[b])ix[b].IT=L[tb][b]}
  GLC=null}
async function loadTables(){loadPrefs();applyData(await fetchData())}
async function reloadData(){if(TXB)return;try{applyData(await fetchData())}catch(e){return ended(e.status)}if(STK.length)redraw();else home();msgRaw('Data reloaded from the server','s')}
let TXB=null,PHN=0,SAVING=false;const PHMAP={};
const PH_RE=/\{#[A-Z0-9]+\.[0-9]+#\}/g;
const sub=s=>typeof s=='string'&&s.indexOf('{#')>=0?s.replace(PH_RE,m=>PHMAP[m]||m):s;
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
function batch(){if(!TXB){TXB={id:uuid(),ops:[],undo:[],msgs:[],refs:[],after:[]};queueMicrotask(flush)}return TXB}
const snap=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
function upd(tb,r,ch){const b=batch();const key={};[].concat(KEY[tb]).forEach(k=>key[k]=r[k]);const prev={},expect={};
  for(const k in ch){prev[k]=snap(r[k]);if(k!='IT')expect[k]=r[k]==null?'':r[k]}
  b.ops.push({op:'update',t:tb,key,set:snap(ch),expect});b.undo.push(()=>{for(const k in prev){if(prev[k]===undefined)delete r[k];else r[k]=prev[k]}});
  Object.assign(r,ch);b.refs.push(r);GLC=null}
function addRow(tb,r){const b=batch();T[tb].push(r);b.ops.push({op:'insert',t:tb,row:snap(r)});b.undo.push(()=>{const i=T[tb].indexOf(r);if(i>=0)T[tb].splice(i,1)});b.refs.push(r);GLC=null;return r}
/* The number is assigned by the server; until then a unique placeholder stands in for it. */
function nr(name){batch();return'{#'+name.toUpperCase()+'.'+(++PHN)+'#}'}
function onCommitted(fn){if(TXB&&!TXB.sent)TXB.after.push(fn);else fn()}
function fixObj(o,seen){if(!o||typeof o!='object'||seen.has(o))return;seen.add(o);for(const k in o){const v=o[k];if(typeof v=='string'){if(v.indexOf('{#')>=0)o[k]=sub(v)}else if(v&&typeof v=='object')fixObj(v,seen)}}
function fixDom(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))if(n.nodeValue.indexOf('{#')>=0)n.nodeValue=sub(n.nodeValue);$$('input,textarea',root).forEach(i=>{if(i.value.indexOf('{#')>=0)i.value=sub(i.value)});$$('[title]',root).forEach(e=>{if(e.title.indexOf('{#')>=0)e.title=sub(e.title)})}
function saving(on){SAVING=on;let o=document.getElementById('saving');if(on&&!o){o=document.createElement('div');o.id='saving';o.className='ov';o.innerHTML='<div class="dlg" style="min-width:260px" role="status" aria-live="polite"><div class="db">Saving changes&hellip;</div></div>';document.body.appendChild(o)}if(!on&&o)o.remove()}
function ended(status){try{parent.postMessage({type:'access:ended',status:status||401},location.origin)}catch(e){}closeAllDlg();$('#scr').innerHTML='<div class="note" style="padding:30px" role="alert">Your access to this application has ended.</div>';setFoot([]);setTB([])}
async function flush(){const b=TXB;if(!b||b.sent)return;b.sent=true;saving(true);let res=null,err=null;
  for(let a=0;a<3;a++){try{const r=await fetch(API+'/commit',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',cache:'no-store',body:JSON.stringify({requestId:b.id,ops:b.ops})});const body=await r.json().catch(()=>null);
      if(r.ok&&body){res=body;err=null;break}err={status:r.status,message:body&&body.error&&body.error.message};if(r.status<500)break}
    catch(e){err={status:0,message:''}}
    await new Promise(z=>setTimeout(z,400*(a+1)))}
  TXB=null;saving(false);
  if(res){Object.assign(PHMAP,res.numbers||{});const seen=new Set();b.refs.forEach(r=>fixObj(r,seen));fixObj(ST,seen);persist();fixDom(document.body);
    b.after.forEach(f=>f());const shown=b.msgs.filter(m=>m[0]);if(shown.length){const m=shown[shown.length-1];msgRaw(sub(m[0]),m[1])}return}
  if(err.status==401||err.status==403){ended(err.status);return}
  if(err.status==409||err.status==0||err.status>=500){try{applyData(await fetchData())}catch(e){return ended(e.status)}if(STK.length)redraw();msgRaw(err.status==409&&err.message?err.message:'The changes could not be confirmed. The data has been reloaded from the server - check the result before repeating the step.','e');return}
  b.undo.reverse().forEach(u=>u());GLC=null;if(STK.length)redraw();msgRaw('Changes could not be saved: '+(err.message||'the server rejected the request.'),'e')}
function msg(t,ty){if(TXB&&!TXB.sent){TXB.msgs.push([t,ty]);return}msgRaw(t,ty)}
