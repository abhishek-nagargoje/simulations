<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>HR Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f3fa;--card:#fff;--tx:#1e1b2e;--mu:#6b6784;--ac:#5b2bd9;--ac2:#ede7fd;--bd:#e2deef;--ok:#16794c;--bad:#b3261e;--wn:#9a6700}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15121f;--card:#1f1b2e;--tx:#ece9f7;--mu:#9d98b8;--ac:#9b7bff;--ac2:#2b2445;--bd:#322c4a;--ok:#4cc38a;--bad:#ff8a80;--wn:#e6b84d}}
:root[data-theme="dark"]{--bg:#15121f;--card:#1f1b2e;--tx:#ece9f7;--mu:#9d98b8;--ac:#9b7bff;--ac2:#2b2445;--bd:#322c4a;--ok:#4cc38a;--bad:#ff8a80;--wn:#e6b84d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.logo{font:700 24px "Trebuchet MS",Arial,sans-serif;letter-spacing:-.5px;color:var(--ac);display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--ac);display:inline-block;position:relative}.logo i:after{content:"";position:absolute;inset:7px;border:3px solid #fff;border-radius:3px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:28px;width:100%;max-width:380px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--ac2);color:var(--ac)}button.d{background:transparent;color:var(--bad);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{min-height:100vh}
nav{position:fixed;left:0;top:0;bottom:0;width:200px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;overflow:auto}
nav a{display:block;padding:8px 12px;border-radius:7px;color:var(--tx);cursor:pointer;margin:2px 0}
nav a.on{background:var(--ac2);color:var(--ac);font-weight:700}
main{margin-left:200px;padding:20px;max-width:1200px}
h2{margin:0 0 14px;font-size:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.k b{display:block;font-size:24px}.k span{color:var(--mu);font-size:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;align-items:end}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.t{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--ac2);color:var(--ac)}
.t.ok{color:var(--ok)}.t.no{color:var(--bad)}.t.wn{color:var(--wn)}
.pipe{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px;overflow-x:auto}
.col{background:var(--bg);border-radius:8px;padding:8px;min-height:80px}.col h4{margin:0 0 6px;font-size:12px;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:12px}
#toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;z-index:9}
@media(max-width:760px){nav{position:static;width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:8px}nav a{white-space:nowrap}nav .logo{display:none}main{margin:0;padding:12px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="toast"></div>
<script>
const KEY="hrms_v1:"+(window.__CLASSROOM__||"standalone");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),today=()=>new Date().toISOString().slice(0,10),mon=()=>today().slice(0,7);
let S,tab="dash",authed=false;
function seed(){return{emps:[
{id:"E001",name:"Anita Rao",dept:"HR",desig:"HR Manager",loc:"Pune",doj:"2022-04-01",ctc:900000,mgr:"",status:"Active",email:"anita@abc.com",pan:"",bank:""},
{id:"E002",name:"Rohit Mehta",dept:"Sales",desig:"Sales Executive",loc:"Mumbai",doj:"2023-06-12",ctc:480000,mgr:"E001",status:"Active",email:"rohit@abc.com",pan:"",bank:""},
{id:"E003",name:"Sneha Kulkarni",dept:"IT",desig:"Developer",loc:"Pune",doj:"2021-09-20",ctc:1200000,mgr:"E001",status:"Active",email:"sneha@abc.com",pan:"",bank:""}],
jobs:[{id:"J1",title:"Sales Executive",dept:"Sales",open:5,loc:"Mumbai"}],cands:[{id:"C1",name:"Vikas Shah",job:"J1",stage:"Applied"}],att:[],leaves:[],goals:[],lop:{}}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S||!S.emps){S=seed();S.emps=gen(5000)}else if(!S.std&&S.emps.length===3&&S.emps[0].email==="anita@abc.com"){S.emps=gen(5000);S.goals=[];S.att=[];S.leaves=[];S.lop={}}S.std=1}
function gen(n){let a=20260707;const r=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},p=x=>x[Math.floor(r()*x.length)];
 const F="Aarav Anita Rohit Sneha Vikram Priya Amit Neha Rahul Pooja Suresh Kavita Manoj Divya Arjun Meera Karan Ritu Sanjay Anjali Deepak Swati Nikhil Shruti Ajay Isha Varun Nisha Gaurav Komal".split(" "),
 L="Sharma Patil Mehta Rao Kulkarni Shah Verma Iyer Nair Reddy Gupta Joshi Deshmukh Singh Kapoor Pillai Bose Khan Jain Desai Chavan Menon Agarwal Mishra".split(" "),
 D={Sales:["Sales Executive","Senior Sales Executive","Sales Manager"],IT:["Software Engineer","Senior Engineer","Engineering Manager"],HR:["HR Executive","HR Business Partner","HR Manager"],Finance:["Accountant","Senior Accountant","Finance Manager"],Operations:["Operations Executive","Team Lead","Operations Manager"],Marketing:["Marketing Executive","Senior Marketer","Marketing Manager"],Support:["Support Associate","Senior Associate","Support Manager"],Admin:["Admin Executive","Senior Admin","Admin Manager"]},
 Lc=["Pune","Mumbai","Bengaluru","Delhi","Hyderabad","Chennai"],ds=Object.keys(D),heads={},out=[];
 for(let i=1;i<=n;i++){const d=p(ds),lv=r()<.7?0:r()<.8?1:2,id="E"+String(i).padStart(4,"0"),f=p(F),l=p(L);if(!heads[d])heads[d]=id;
 out.push({id,name:f+" "+l,dept:d,desig:D[d][lv],loc:p(Lc),doj:new Date(Date.now()-r()*11*365*864e5).toISOString().slice(0,10),ctc:Math.round((250000+r()*(lv===0?450000:lv===1?800000:1800000))/1000)*1000,mgr:heads[d]===id?"":heads[d],status:r()<.07?"Exited":"Active",email:(f+"."+l+i).toLowerCase()+"@abc.com",pan:"",bank:""})}
 return out}
var EP=0,PP=0,EQ="";
const empList=()=>{const q=EQ.toLowerCase();return q?S.emps.filter(e=>(e.name+e.id+e.dept+e.desig+e.loc).toLowerCase().includes(q)):S.emps};
const pager=(v,pg,n)=>`<div class="bar"><button class="s" onclick="${v}=Math.max(0,${v}-1);go(tab)">Prev</button> Page ${pg+1} of ${Math.max(1,Math.ceil(n/50))} (${n.toLocaleString("en-IN")} records) <button class="s" onclick="${v}=Math.min(${Math.max(0,Math.ceil(n/50)-1)},${v}+1);go(tab)">Next</button></div>`;
function loadStandardData(){if(confirm("Replace all employees with the standard data set of 5,000 employee records? Goals, attendance and leave will be cleared.")){S.emps=gen(5000);S.goals=[];S.att=[];S.leaves=[];S.lop={};EP=0;PP=0;go("emp")}}
function save(){const v=JSON.stringify(S);for(let n=0;n<8;n++){try{localStorage.setItem(KEY,v);return}catch(e){if(!hrmsEvict())break}}toast("Browser storage is full — recent changes in this classroom may not be kept")}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2200)}
async function dl(name,text,type){try{const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){toast("Could not save file")}}
const csv=rows=>rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
// ---- CTC engine (monthly, India, new-regime TDS estimate) ----
function ctcCalc(annual,lop=0){const m=annual/12,basic=annual*.4/12,hra=basic*.5,conv=1600,med=1250,erPF=Math.min(basic,15000)*.12,grat=basic*.0481;
 const special=Math.max(0,m-basic-hra-conv-med-erPF-grat),gross=basic+hra+conv+med+special,lopAmt=gross/30*lop,earn=gross-lopAmt;
 const eePF=erPF,esi=gross<=21000?gross*.0075:0,pt=gross>=10000?200:0;
 const ti=Math.max(0,annual-75000-erPF*12);let tax=0;[[400000,0],[800000,.05],[1200000,.1],[1600000,.15],[2000000,.2],[2400000,.25],[1e12,.3]].reduce((lo,[hi,r])=>{if(ti>lo)tax+=(Math.min(ti,hi)-lo)*r;return hi},0);
 if(ti<=1200000)tax=0;tax*=1.04;const tds=tax/12,ded=eePF+esi+pt+tds;
 return{basic,hra,conv,med,special,gross,lopAmt,earn,eePF,esi,pt,tds,ded,net:earn-ded,erPF,grat}}
const nm=id=>(S.emps.find(e=>e.id===id)||{}).name||"-";
const TABS=[["dash","Dashboard"],["emp","Employees"],["rec","Recruitment"],["att","Attendance"],["leave","Leave"],["pay","Payroll & CTC"],["perf","Performance"],["rep","Reports"]];
function go(t){tab=t;$("#nav").innerHTML='<div class="logo" style="margin:4px 8px 16px"><i></i>HR Management</div>'+TABS.map(([k,l])=>`<a class="${k===t?"on":""}" onclick="go('${k}')">${l}</a>`).join("")+'<a onclick="hrmsExit()" style="color:var(--mu)">Exit</a>';
 $("#main").innerHTML=VIEWS[t]();save()}
const act=()=>S.emps.filter(e=>e.status==="Active");
const empOpts=()=>S.emps.map(e=>`<option value="${e.id}">${esc(e.name)} (${e.id})</option>`).join("");
const VIEWS={
dash(){const a=act(),ex=S.emps.length-a.length,pc=a.reduce((s,e)=>s+e.ctc,0)/12,td=S.att.filter(x=>x.date===today()),pend=S.leaves.filter(l=>l.status==="Pending").length;
 const depts={};a.forEach(e=>depts[e.dept]=(depts[e.dept]||0)+1);
 return`<h2>Dashboard</h2><div class="g">${[["Active employees",a.length],["Monthly CTC cost",inr(pc)],["Attrition",(S.emps.length?ex/S.emps.length*100:0).toFixed(1)+"%"],["Open positions",S.jobs.reduce((s,j)=>s+ +j.open,0)],["Present today",td.length],["Pending leaves",pend]].map(([l,v])=>`<div class="c k"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
 <div class="c"><b>Headcount by department</b><div class="sc"><table><tr>${Object.entries(depts).map(([d,n])=>`<th>${esc(d)}</th>`).join("")}</tr><tr>${Object.values(depts).map(n=>`<td>${n}</td>`).join("")}</tr></table></div></div>`},
emp(){return`<h2>Employees</h2><div class="c"><form class="f" onsubmit="addEmp(event)"><div><label>Name</label><input name="name" required></div><div><label>Department</label><input name="dept" required></div><div><label>Designation</label><input name="desig" required></div><div><label>Location</label><input name="loc"></div><div><label>Joining date</label><input type="date" name="doj" value="${today()}"></div><div><label>Annual CTC (₹)</label><input type="number" name="ctc" min="0" required></div><div><label>Manager</label><select name="mgr"><option value="">None</option>${empOpts()}</select></div><div><label>Email</label><input type="email" name="email"></div><div><button>Add employee</button></div></form></div>
 <div class="bar"><input id="eq" placeholder="Search name, ID, department, location" value="${esc(EQ)}" onchange="EQ=this.value;EP=0;go('emp')" style="max-width:300px"><button class="s" onclick="expEmp()">Download CSV</button><button class="s" onclick="loadStandardData()">Reload standard employee data (5,000)</button></div><div class="c sc"><table><tr><th>ID</th><th>Name</th><th>Dept</th><th>Designation</th><th>Manager</th><th>CTC</th><th>Status</th><th></th></tr>${empList().slice(EP*50,EP*50+50).map(e=>`<tr><td>${e.id}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td>${esc(e.desig)}</td><td>${esc(nm(e.mgr))}</td><td>${inr(e.ctc)}</td><td><span class="t ${e.status==="Active"?"ok":"no"}">${e.status}</span></td><td><button class="s" onclick="editCtc('${e.id}')">Revise CTC</button> <button class="s" onclick="exitEmp('${e.id}')">${e.status==="Active"?"Exit":"Reactivate"}</button> <button class="d" onclick="delEmp('${e.id}')">Delete</button></td></tr>`).join("")}</table></div>${pager("EP",EP,empList().length)}`},
rec(){const st=["Applied","Screening","Interview","Selected","Offered","Joined"];
 return`<h2>Recruitment</h2><div class="c"><form class="f" onsubmit="addJob(event)"><div><label>Job title</label><input name="title" required></div><div><label>Department</label><input name="dept"></div><div><label>Openings</label><input type="number" name="open" min="1" value="1"></div><div><label>Location</label><input name="loc"></div><div><button>Create job</button></div></form></div>
 <div class="c"><form class="f" onsubmit="addCand(event)"><div><label>Candidate name</label><input name="name" required></div><div><label>Job</label><select name="job">${S.jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join("")}</select></div><div><button>Add candidate</button></div></form></div>
 <div class="c"><div class="pipe">${st.map(s=>`<div class="col"><h4>${s} (${S.cands.filter(c=>c.stage===s).length})</h4>${S.cands.filter(c=>c.stage===s).map(c=>`<div class="card">${esc(c.name)}<br><small>${esc((S.jobs.find(j=>j.id===c.job)||{}).title||"")}</small><br>${s!==st[0]?`<button class="s" onclick="mv('${c.id}',-1)">◀</button> `:""}${s!==st[5]?`<button class="s" onclick="mv('${c.id}',1)">▶</button>`:""}${s==="Joined"?`<button class="s" onclick="hire('${c.id}')">Create employee</button>`:""}</div>`).join("")}</div>`).join("")}</div></div>`},
att(){const rows=S.att.slice().reverse().slice(0,40);return`<h2>Attendance</h2><div class="c"><div class="bar"><select id="ae" style="max-width:260px">${empOpts()}</select><button onclick="punch('in')">Check in</button><button class="s" onclick="punch('out')">Check out</button></div></div>
 <div class="c sc"><table><tr><th>Date</th><th>Employee</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th></tr>${rows.map(r=>{const h=r.out?(new Date(r.out)-new Date(r.in))/36e5:0;return`<tr><td>${r.date}</td><td>${esc(nm(r.emp))}</td><td>${new Date(r.in).toLocaleTimeString()}</td><td>${r.out?new Date(r.out).toLocaleTimeString():"-"}</td><td>${r.out?h.toFixed(2):"-"}</td><td><span class="t ${!r.out?"wn":h<4?"no":"ok"}">${!r.out?"Working":h<4?"Short hours":"Present"}</span></td></tr>`}).join("")||'<tr><td colspan="6">No punches yet. Pick an employee and check in.</td></tr>'}</table></div>`},
leave(){return`<h2>Leave</h2><div class="c"><form class="f" onsubmit="addLeave(event)"><div><label>Employee</label><select name="emp">${empOpts()}</select></div><div><label>Type</label><select name="type"><option>Casual Leave</option><option>Sick Leave</option><option>Earned Leave</option></select></div><div><label>From</label><input type="date" name="from" value="${today()}" required></div><div><label>To</label><input type="date" name="to" value="${today()}" required></div><div><label>Reason</label><input name="why"></div><div><button>Apply leave</button></div></form></div>
 <div class="c sc"><table><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Status</th><th></th></tr>${S.leaves.map((l,i)=>`<tr><td>${esc(nm(l.emp))}</td><td>${l.type}</td><td>${l.from}</td><td>${l.to}</td><td>${l.days}</td><td><span class="t ${l.status==="Approved"?"ok":l.status==="Rejected"?"no":"wn"}">${l.status}</span></td><td>${l.status==="Pending"?`<button class="s" onclick="lv(${i},'Approved')">Approve</button> <button class="d" onclick="lv(${i},'Rejected')">Reject</button>`:""}</td></tr>`).join("")||'<tr><td colspan="7">No leave requests.</td></tr>'}</table></div>`},
pay(){const m=mon();return`<h2>Payroll & CTC</h2><div class="c"><b>CTC calculator</b><div class="f"><div><label>Annual CTC (₹)</label><input id="cc" type="number" value="600000" oninput="cl()"></div></div><div id="cr" class="sc"></div></div>
 <div class="c"><b>Payroll run for ${m}</b> <small style="color:var(--mu)">Enter loss-of-pay (LOP) days; payslips update live.</small><div class="bar"><button class="s" onclick="expPay()">Download payroll register (CSV)</button></div><div class="sc"><table><tr><th>Employee</th><th>CTC</th><th>LOP days</th><th>Gross</th><th>PF</th><th>ESI</th><th>PT</th><th>TDS</th><th>Net pay</th><th></th></tr>${act().slice(PP*50,PP*50+50).map(e=>{const l=+(S.lop[m+e.id]||0),r=ctcCalc(e.ctc,l);return`<tr><td>${esc(e.name)}</td><td>${inr(e.ctc)}</td><td><input type="number" min="0" max="30" value="${l}" style="width:70px" onchange="S.lop['${m}${e.id}']=this.value;go('pay')"></td><td>${inr(r.earn)}</td><td>${inr(r.eePF)}</td><td>${inr(r.esi)}</td><td>${inr(r.pt)}</td><td>${inr(r.tds)}</td><td><b>${inr(r.net)}</b></td><td><button class="s" onclick="slip('${e.id}')">Payslip</button></td></tr>`}).join("")}</table></div>${pager("PP",PP,act().length)}</div>`},
perf(){return`<h2>Performance</h2><div class="c"><form class="f" onsubmit="addGoal(event)"><div><label>Employee</label><select name="emp">${empOpts()}</select></div><div><label>Goal / KPI</label><input name="goal" required></div><div><label>Weight %</label><input type="number" name="w" min="1" max="100" value="25"></div><div><button>Add goal</button></div></form></div>
 <div class="c sc"><table><tr><th>Employee</th><th>Goal</th><th>Weight</th><th>Self</th><th>Manager</th><th>Weighted</th><th></th></tr>${S.goals.map((g,i)=>`<tr><td>${esc(nm(g.emp))}</td><td>${esc(g.goal)}</td><td>${g.w}%</td><td>${rs(i,"self")}</td><td>${rs(i,"mgr")}</td><td>${g.mgr?(g.mgr*g.w/100).toFixed(2):"-"}</td><td><button class="d" onclick="S.goals.splice(${i},1);go('perf')">Delete</button></td></tr>`).join("")||'<tr><td colspan="7">No goals yet.</td></tr>'}</table></div>
 <div class="c"><b>Final ratings and increment</b> <small style="color:var(--mu)">(rating ≥4.5: 12%, ≥3.5: 8%, ≥2.5: 5%, else 0%)</small><div class="sc"><table><tr><th>Employee</th><th>Rating</th><th>Increment</th><th>New CTC</th><th></th></tr>${act().filter(e=>S.goals.some(g=>g.emp===e.id&&g.mgr)).map(e=>{const r=rate(e.id),p=r>=4.5?12:r>=3.5?8:r>=2.5?5:0;return`<tr><td>${esc(e.name)}</td><td>${r.toFixed(2)}</td><td>${p}%</td><td>${inr(e.ctc*(1+p/100))}</td><td><button class="s" onclick="applyInc('${e.id}',${p})">Apply</button></td></tr>`}).join("")||'<tr><td colspan="5">Add manager ratings to see increments.</td></tr>'}</table></div></div>`},
rep(){return`<h2>Reports</h2><div class="c"><div class="bar"><button onclick="expEmp()">Employee master</button><button onclick="expPay()">Payroll register</button><button onclick="expAtt()">Attendance</button><button onclick="expLv()">Leave</button><button class="s" onclick="bk()">Full backup (JSON)</button></div></div>`}};
const rs=(i,k)=>`<select onchange="S.goals[${i}].${k}=+this.value;go('perf')"><option value="">-</option>${[1,2,3,4,5].map(n=>`<option ${S.goals[i][k]===n?"selected":""}>${n}</option>`).join("")}</select>`;
const rate=id=>{const g=S.goals.filter(x=>x.emp===id&&x.mgr),w=g.reduce((s,x)=>s+ +x.w,0);return w?g.reduce((s,x)=>s+x.mgr*x.w,0)/w:0};
const nid=()=>"E"+String(S.emps.reduce((m,e)=>Math.max(m,+e.id.slice(1)),0)+1).padStart(3,"0");
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
function addEmp(e){const d=fd(e);S.emps.push({...d,id:nid(),ctc:+d.ctc,status:"Active",pan:"",bank:""});toast("Employee added");go("emp")}
function delEmp(id){if(confirm("Delete this employee permanently?")){S.emps=S.emps.filter(e=>e.id!==id);go("emp")}}
function exitEmp(id){const e=S.emps.find(x=>x.id===id);e.status=e.status==="Active"?"Exited":"Active";go("emp")}
